<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EventFlow</title>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { theme: { extend: { colors: { primary:{400:'#c084fc',500:'#a855f7'}, accent:{500:'#ec4899'} }, fontFamily:{sans:['Inter','system-ui','sans-serif']} } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { color-scheme:dark; background-color:#0f0f23; } html,body{min-height:100vh;margin:0;padding:0}
    body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f0f23 100%) !important;background-attachment:fixed !important;color:#fff !important}
    .glass-card{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.1)!important}
    .btn-primary{background:linear-gradient(135deg,#a855f7 0%,#ec4899 100%)!important;color:#fff!important}
    .input-glow:focus{box-shadow:0 0 0 4px rgba(168,85,247,.25),0 0 0 1px rgba(236,72,153,.25)!important}
  </style>
</head>
<body class="gradient-bg text-white font-sans overflow-x-hidden">
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="blob w-96 h-96 bg-primary-600 top-20 -left-48"></div>
    <div class="blob w-80 h-80 bg-accent-500 top-1/2 -right-40"></div>
    <div class="blob w-72 h-72 bg-primary-500 bottom-20 left-1/3"></div>
  </div>
  <a href="/login.html" class="fixed top-5 left-5 z-50 px-4 py-2 rounded-full glass-card text-sm text-gray-300 hover:text-white hover:bg-white/10 transition-colors"><i class="fas fa-arrow-left mr-2"></i>Back to Login</a>

  <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card rounded-3xl p-8 max-w-md w-full">
      <div class="flex items-center justify-center mb-5"><div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center"><i class="fas fa-key"></i></div></div>
      <h1 id="pageTitle" class="text-3xl font-bold mb-2 text-center">Forgot Password?</h1>
      <p id="pageDescription" class="text-gray-400 mb-6 text-center">Enter your account email and we'll generate a secure password reset link.</p>
      <div id="resetMessage" class="hidden mb-4 rounded-2xl px-4 py-3 text-sm"></div>

      <form id="requestResetForm" class="space-y-4">
        <div><label class="block text-sm font-medium mb-2">Email</label><input id="resetEmail" type="email" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-primary-500 focus:outline-none input-glow transition-all" placeholder="you@example.com" required></div>
        <button type="submit" class="w-full btn-primary py-3 rounded-xl font-semibold">Send Reset Link</button>
      </form>

      <form id="resetTokenForm" class="space-y-4 hidden">
        <div><label class="block text-sm font-medium mb-2">New Password</label><input id="resetTokenNewPassword" type="password" minlength="8" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-primary-500 focus:outline-none input-glow transition-all" placeholder="At least 8 characters" required></div>
        <div><label class="block text-sm font-medium mb-2">Confirm Password</label><input id="resetTokenConfirmPassword" type="password" minlength="8" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-primary-500 focus:outline-none input-glow transition-all" placeholder="Repeat your password" required></div>
        <button type="submit" class="w-full btn-primary py-3 rounded-xl font-semibold">Update Password</button>
      </form>

      <a id="demoResetLink" href="#" class="hidden mt-4 w-full text-center px-4 py-3 rounded-xl border border-primary-400/30 bg-primary-500/10 text-primary-200 hover:bg-primary-500/20 transition-colors">Continue to Reset Password</a>
      <div class="mt-6 text-center"><a href="/login.html" class="text-primary-400 hover:underline">Back to Login</a></div>
    </div>
  </div>

  <script>
    const params=new URLSearchParams(window.location.search);
    const token=params.get('token');
    const requestForm=document.getElementById('requestResetForm');
    const tokenForm=document.getElementById('resetTokenForm');
    const message=document.getElementById('resetMessage');
    const title=document.getElementById('pageTitle');
    const description=document.getElementById('pageDescription');
    const demoLink=document.getElementById('demoResetLink');

    const showMessage=(text,type='success')=>{ message.textContent=text; message.className='mb-4 rounded-2xl px-4 py-3 text-sm '+(type==='error'?'border border-red-400/20 bg-red-500/10 text-red-100':'border border-green-400/20 bg-green-500/10 text-green-100'); };

    if(token){
      requestForm.classList.add('hidden'); tokenForm.classList.remove('hidden');
      title.textContent='Reset Password'; description.textContent='Create a new password for your EventFlow account.';
    }

    requestForm.addEventListener('submit',async(e)=>{
      e.preventDefault(); demoLink.classList.add('hidden');
      const email=document.getElementById('resetEmail').value.trim();
      try{
        const res=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'Unable to process the request.');
        showMessage(data.message||'If the email exists, reset instructions have been generated.');
        if(data.resetLink){ demoLink.href=data.resetLink; demoLink.classList.remove('hidden'); }
      }catch(err){ showMessage(err.message||'Unable to process the request.','error'); }
    });

    tokenForm.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const password=document.getElementById('resetTokenNewPassword').value;
      const confirm=document.getElementById('resetTokenConfirmPassword').value;
      if(password.length<8){showMessage('Password must be at least 8 characters long.','error');return;}
      if(password!==confirm){showMessage('Passwords do not match.','error');return;}
      try{
        const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'Unable to reset password.');
        showMessage('Password updated successfully. Redirecting to login...');
        setTimeout(()=>window.location.href='/login.html',1000);
      }catch(err){showMessage(err.message||'Unable to reset password.','error');}
    });
  </script>
</body>
</html>
